<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F4EEDF;--superficie:#FBF7EC;--tinta:#2B2420;--suave:#5F574C;--linea:#D9CFB8;
  --vino:#7A2E2E;--vino-fuerte:#5F2222;--sobre-color:#FFF8EC;--oro:#B8862D;--oro-fondo:#F0E3BF;--bosque:#2F5A3B;--piedra:#8A8172;--marco:#2B2420;
  --pixel:"Pixelify Sans","Fira Sans",sans-serif;--texto:"Fira Sans",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#1C1814;--superficie:#26211B;--tinta:#EFE7D6;--suave:#B8AE9C;--linea:#3D362C;
  --vino:#E09A8E;--vino-fuerte:#EDB5AB;--sobre-color:#1C1814;--oro:#D4A94A;--oro-fondo:#3A3020;--bosque:#8CC49B;--piedra:#9A9080;--marco:#6E6554;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.45 var(--texto);overflow-wrap:anywhere}
a{color:inherit}
p{margin:0}
.pix{display:block;width:24px;height:24px;flex:none}
.pix.ico{width:16px;height:16px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.saltar{position:absolute;left:-999px;top:0;background:var(--superficie);padding:12px 16px;z-index:12}
.saltar:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
.marco{max-width:960px;margin:0 auto;padding:0 16px}

/* Cabecera */
.cabecera{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 16px;padding-top:14px;padding-bottom:10px}
.marca{display:flex;align-items:center;gap:10px}
.marca .pix{width:28px;height:28px}
h1{font:600 24px/1.1 var(--pixel);margin:0}
.actualizado{font-size:14px;color:var(--suave)}
.almenas{height:8px;background:
  repeating-linear-gradient(90deg,var(--tinta) 0 12px,transparent 12px 20px) top/100% 4px no-repeat,
  linear-gradient(var(--tinta),var(--tinta)) bottom/100% 4px no-repeat}

/* Pestañas: el camino de una oferta */
.nav{position:sticky;top:0;z-index:5;background:var(--fondo);border-bottom:1px solid var(--linea)}
.nav ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));list-style:none;margin:0;padding:0}
.nav li{position:relative}
.nav a{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 6px;min-height:64px;padding:8px 8px 4px;
  text-decoration:none;color:var(--suave);border-bottom:4px solid transparent;text-align:center}
.nav a:hover{color:var(--tinta);background:var(--superficie)}
.nav a[aria-current=page]{color:var(--tinta);border-bottom-color:var(--vino)}
.nav .pix{width:20px;height:20px}
.nav .cifra{font:600 21px/1 var(--texto);font-variant-numeric:tabular-nums}
.nav .nombre{flex-basis:100%;font:500 15px/1.15 var(--pixel)}
.nav a[aria-current=page] .nombre{font-weight:600}
.nav .paso{position:absolute;left:-8px;top:50%;margin-top:-10px;color:var(--piedra)}

/* Vistas */
main.marco{padding-top:20px;padding-bottom:24px}
main:focus,h2:focus,.estado:focus{outline:none}
h2{font:600 24px/1.2 var(--pixel);margin:0}
.intro{margin:2px 0 10px;color:var(--suave)}
.intro b{font-weight:600;color:var(--tinta)}

/* Leyenda */
.ayuda{margin:0 0 14px;font-size:15px}
.ayuda summary{display:inline-flex;align-items:center;gap:4px;min-height:44px;cursor:pointer;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;list-style:none}
.ayuda summary::-webkit-details-marker,.plegable summary::-webkit-details-marker{display:none}
.ayuda summary .pix,.plegable summary .pix{color:var(--suave)}
details[open]>summary .pix.giro{transform:rotate(90deg)}
.ayuda dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:4px 0 0;padding:12px 14px;background:var(--superficie);border:1px solid var(--linea)}
.ayuda dt{font-weight:600}
.ayuda dd{margin:0;color:var(--suave)}
.ayuda .nota{grid-column:1/-1;color:var(--suave)}

/* Empieza por aquí: marco con esquinas de pixel */
.destacadas{background:var(--superficie);margin:4px 4px 28px;padding:14px 14px 2px;
  box-shadow:0 -4px 0 var(--marco),0 4px 0 var(--marco),-4px 0 0 var(--marco),4px 0 0 var(--marco)}
.destacadas .cab{display:flex;align-items:center;gap:8px}
.destacadas h3{font:600 20px/1.2 var(--pixel);margin:0}
.destacadas .sub{font-size:15px;color:var(--suave);margin:2px 0 10px}
.destacadas .lista{gap:0}
.destacadas .tarjeta{background:none;border:0;border-top:1px solid var(--linea);padding:14px 0}

/* Filtros */
.herramientas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:end;margin:0 0 6px}
.campo{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--suave)}
.campo.buscar{grid-column:1/-1}
input[type=search],select{font:400 16px var(--texto);color:var(--tinta);background:var(--superficie);
  border:1px solid var(--piedra);border-radius:2px;min-height:44px;padding:8px 10px;width:100%}
.casilla{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:44px;color:var(--tinta);cursor:pointer}
.casilla input{width:20px;height:20px;accent-color:var(--vino);margin:0}
.conteo{display:flex;align-items:center;gap:10px;min-height:32px;margin-bottom:4px}
.estado{font-size:14px;color:var(--suave)}
.conteo button{min-height:44px;padding:0 4px}

/* Grupos */
.grupo{margin-top:18px}
.grupo>h3,.plegable>summary{font:600 19px/1.25 var(--pixel);margin:0;color:var(--tinta)}
.grupo .n{font:500 15px var(--texto);color:var(--suave);margin-left:8px;font-variant-numeric:tabular-nums}
.nota-grupo{margin:0 0 8px;font-size:15px;color:var(--suave)}
.grupo>h3{padding:4px 0 2px}
.plegable>summary{display:flex;align-items:center;gap:6px;min-height:48px;cursor:pointer;list-style:none;border-top:2px solid var(--tinta);padding:6px 0}
.plegable>summary:hover{color:var(--vino)}
.plegable>summary h3{font:inherit;margin:0}

/* Tarjetas */
.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tarjeta{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px 12px;background:var(--superficie);border:1px solid var(--linea);border-radius:2px;padding:14px}
.logo{position:relative;display:block;width:44px;height:44px;background:var(--oro-fondo);color:var(--tinta);
  font:600 16px/38px var(--texto);text-align:center;
  clip-path:polygon(0 0,100% 0,100% 72%,90% 72%,90% 82%,80% 82%,80% 90%,60% 90%,60% 100%,40% 100%,40% 90%,20% 90%,20% 82%,10% 82%,10% 72%,0 72%)}
.logo.con-imagen{background:#fff;clip-path:none;border:1px solid var(--linea);border-radius:2px;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;background:#fff}
.logo img.chico{image-rendering:pixelated;padding:8px}
.cuerpo{min-width:0}
.sellos{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:5px}
.sello{font:600 14px/1 var(--texto);padding:4px 7px 5px;border-radius:2px;white-space:nowrap}
.sello.nueva{background:var(--bosque);color:var(--sobre-color)}
.sello.cv{background:var(--oro-fondo);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--oro)}
.sello.urge{background:var(--vino);color:var(--sobre-color)}
.sello.ojo{color:var(--vino);box-shadow:inset 0 0 0 1px var(--vino)}
.cargo{font:600 17px/1.3 var(--texto);margin:0}
.cargo a{text-decoration:underline;text-decoration-color:var(--piedra);text-decoration-thickness:1px;text-underline-offset:3px}
.cargo a:hover{color:var(--vino);text-decoration-color:currentColor}
.empresa{color:var(--suave)}
.razon{margin-top:5px;font-size:15px}
.datos{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:14px;color:var(--suave);font-variant-numeric:tabular-nums}
.datos .renta{color:var(--tinta);font-weight:500}
.detalle{margin-top:5px;font-size:15px;color:var(--suave)}
.novedad{margin-top:8px;font-size:15px;padding:8px 10px;background:var(--oro-fondo);border-radius:2px}
.novedad b{font-weight:600}

.lado{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0}
.calce{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.barra{display:flex;gap:2px}
.barra i{display:block;width:10px;height:14px;background:var(--linea)}
.barra.alto i.on{background:var(--bosque)}
.barra.medio i.on{background:var(--oro)}
.barra.bajo i.on{background:var(--piedra)}
.acciones{display:flex;gap:6px;align-items:center}
.fecha{font-size:14px;color:var(--suave);font-variant-numeric:tabular-nums}
.fecha b{font-weight:500;color:var(--tinta);margin-right:8px}

/* Botones */
button,.btn{font:500 15px var(--texto);color:var(--tinta);background:transparent;border:1px solid var(--piedra);
  border-radius:2px;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover{background:var(--fondo);border-color:var(--tinta)}
.btn.primario{flex:1 1 auto;background:var(--vino);border-color:var(--vino);color:var(--sobre-color)}
.btn.primario:hover{background:var(--vino-fuerte);border-color:var(--vino-fuerte)}
button.marcar{border-color:var(--tinta)}
button.leve{border-color:transparent;color:var(--suave);padding:0 6px;font-weight:400;text-decoration:underline;text-underline-offset:3px}
button.leve:hover{color:var(--tinta);background:transparent;border-color:transparent}

/* Estados */
.vacio{padding:20px 0;color:var(--suave)}
.vacio button{margin-top:10px;display:flex}
.mas{margin-top:14px}
.compacta{grid-template-columns:44px minmax(0,1fr);padding:10px 14px}

/* Pie */
.pie{padding-top:8px;padding-bottom:88px;font-size:15px;color:var(--suave)}
.pie a{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--tinta);font-weight:500}
.pie a[aria-current=page]{text-decoration-thickness:2px}
.pie .pix{width:20px;height:20px}
.pie .aclara{display:block;font-weight:400;color:var(--suave);font-size:14px}

/* Aviso */
.aviso{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;margin:0 auto;max-width:440px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 8px 6px 16px;
  background:var(--tinta);color:var(--fondo);font-weight:500;border-radius:2px;visibility:hidden;opacity:0;transform:translateY(8px)}
.aviso.ver{visibility:visible;opacity:1;transform:none}
.aviso button{color:var(--fondo);border-color:var(--fondo);flex:none}
.aviso button:hover{background:transparent;color:var(--fondo);border-color:var(--fondo);text-decoration:underline}
.aviso :focus-visible{outline-color:var(--fondo)}

@media (min-width:760px){
  h1{font-size:26px}
  .marco{padding-left:24px;padding-right:24px}
  .marca .pix{width:32px;height:32px}
  .nav a{gap:8px;padding:10px 4px 6px;min-height:60px}
  .nav .nombre{flex-basis:auto;font-size:18px}
  .nav .cifra{font-size:24px}
  .nav .paso{left:-8px}
  .destacadas{padding:16px 20px 4px}
  .herramientas{grid-template-columns:minmax(0,1fr) 170px 180px auto}
  .campo.buscar,.casilla{grid-column:auto}
  .tarjeta{grid-template-columns:48px minmax(0,1fr) auto;gap:4px 18px;padding:14px 16px}
  .destacadas .tarjeta{padding:14px 0}
  .logo{width:48px;height:48px;font-size:18px;line-height:42px}
  .lado{grid-column:auto;align-items:flex-end;gap:10px}
  .acciones .btn.primario{flex:none}
  .fecha{text-align:right}
  .fecha b{display:block;margin:0}
  .compacta{grid-template-columns:48px minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:no-preference){
  a,button,.btn{transition:color .12s,background-color .12s,border-color .12s}
  .aviso{transition:opacity .16s,transform .16s,visibility .16s}
  .pix.giro{transition:transform .12s}
}
</style>
</head>

/* Utilidades */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const aFecha = t => { const m=/^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(t||""); return m?new Date(+m[1],+m[2]-1,+(m[3]||1)):null; };
const esAprox = t => /^\d{4}-\d{2}$/.test(t||"");
const fechaTxt = t => { const d=aFecha(t); if(!d)return "Fecha no registrada"; return esAprox(t)?`≈ ${MESES[d.getMonth()]} ${d.getFullYear()}`:`${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const HOY=new Date(); HOY.setHours(0,0,0,0);
const diasDesde = t => { const d=aFecha(t); return d?Math.round((HOY-d)/864e5):null; };
const haceTxt = t => { if(esAprox(t))return ""; const n=diasDesde(t); if(n===null||n<0)return ""; return n===0?"hoy":n===1?"hace 1 día":`hace ${n} días`; };
const plazoDe = j => { const s=String(j.deadline||""); let m=/(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m)return new Date(+m[1],+m[2]-1,+m[3]); m=/(\d{2})[-/](\d{2})[-/](\d{4})/.exec(s); return m?new Date(+m[3],+m[2]-1,+m[1]):null; };
const diasPlazo = j => { const p=plazoDe(j); return p?Math.round((p-HOY)/864e5):null; };
const vencio = j => { const d=diasPlazo(j); return d!==null&&d<0; };
const cierraPronto = j => { const d=diasPlazo(j); return d!==null&&d>=0&&d<=7; };
const plural = (n,uno,varios) => `${n} ${n===1?uno:varios}`;

/* Calce: siempre con la misma palabra, y con número solo si ya se evaluó. */
const puntaje = j => j.match_pct ?? ({high:75,medium:55,low:30}[j.fit] ?? 50);
const evaluado = j => j.match_pct!=null || ["high","medium","low"].includes(j.fit);
const NIVEL={high:"alto",medium:"medio",low:"bajo"};
const calceTxt = j => j.match_pct!=null?`Calce ${j.match_pct}/100`:(NIVEL[j.fit]?`Calce ${NIVEL[j.fit]}`:"Calce sin evaluar");
const nivelDe = j => puntaje(j)>=70?"alto":puntaje(j)>=50?"medio":"bajo";
function calceHTML(j){
  const n=evaluado(j)?Math.min(5,Math.max(1,Math.round(puntaje(j)/20))):0;
  return `<p class="calce"><span class="barra ${nivelDe(j)}" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>${esc(calceTxt(j))}</p>`;
}
const AREA={"datos-bi":"Datos y BI",investigacion:"Investigación",sociologia:"Sociología",sector_publico:"Sector público"};

const comunaDe = j => { const l=(j.location||"").split(",")[0].trim(); return !l||/^santiago$|no indicada|remoto/i.test(l)?"":l; };
const fuenteTxt = s => String(s||"").replace(/\s*\(feed curado[^)]*\)/i,"");

function logoHTML(empresa){

/* Fuentes de logo: Google, el favicon del propio sitio y DuckDuckGo. Sin logo real queda el escudo con iniciales. */
const FUENTES=[d=>`https://${d}/favicon.ico`,d=>`https://icons.duckduckgo.com/ip3/${d}.ico`];
function siguienteLogo(img){
  const n=+(img.dataset.paso||0);
  if(n>=FUENTES.length){const s=img.parentElement;img.remove();if(s)s.classList.remove("con-imagen");return;}
  img.dataset.paso=n+1;img.src=FUENTES[n](img.dataset.dom);
}
document.addEventListener("load",e=>{
  const img=e.target; if(img.tagName!=="IMG"||!img.dataset.dom)return;
  const paso=+(img.dataset.paso||0);
  /* Google entrega un globo de 16 px si no conoce el dominio; DuckDuckGo, una flecha gris de 48 px. */
  if((paso===0&&img.naturalWidth<=16)||(paso===2&&img.naturalWidth===48)){siguienteLogo(img);return;}
  img.classList.toggle("chico",img.naturalWidth<32);
},true);
document.addEventListener("error",e=>{
  const img=e.target; if(img.tagName==="IMG"&&img.dataset.dom)siguienteLogo(img);
},true);

const tituloHTML=(texto,url)=>`<h4 class="cargo">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(texto)}</a>`:esc(texto)}</h4>`;
function sellosDe(j){
  const s=[], d=diasPlazo(j);
  if(j.ya_postulada)s.push(`<span class="sello ojo">Ya postulaste el ${esc(fechaTxt(j.ya_postulada))}</span>`);

function tarjetaOferta(j,razon=""){

const grupo=(titulo,filas,nota="")=>filas.length?`<section class="grupo"><h3>${titulo}<span class="n">${filas.length}</span></h3>${nota?`<p class="nota-grupo">${nota}</p>`:""}<ul class="lista">${filas.join("")}</ul></section>`:"";
const plegado=(titulo,filas,clave,nota="")=>filas.length?`<details class="grupo plegable" ${abiertos.has(clave)||hayFiltros()?"open":""}><summary data-g="${clave}">${icono("flecha","ico giro")}<h3>${titulo}<span class="n">${filas.length}</span></h3></summary>${nota?`<p class="nota-grupo">${nota}</p>`:""}<ul class="lista">${filas.join("")}</ul></details>`:"";

/* Qué mirar primero: lo que destacó la última revisión y, si falta, CV listo, plazo y calce. */
function destacadas(){
  const abiertas=pendientes(), porIdAbierta=new Map(abiertas.map(j=>[j.id,j]));
  const elegidas=[];
  (DATOS.reporte?.prioridades||[]).forEach(p=>{const j=porIdAbierta.get(p.id); if(j&&!elegidas.some(e=>e.j===j))elegidas.push({j,razon:sinPrivado(p.porque)||razonDe(j)});});
  const peso=j=>(j.cv_listo?100:0)+(cierraPronto(j)?50:0)+puntaje(j)+(esNueva(j)?10:0);
  abiertas.filter(j=>!elegidas.some(e=>e.j===j)&&(j.cv_listo||puntaje(j)>=60||(cierraPronto(j)&&puntaje(j)>=50)))
    .sort((a,b)=>peso(b)-peso(a)).forEach(j=>elegidas.push({j,razon:razonDe(j)}));
  return elegidas.slice(0,3);
}
function razonDe(j){
  const r=[]; if(j.cv_listo)r.push("CV preparado"); if(puntaje(j)>=70)r.push("calce alto"); else if(puntaje(j)>=60)r.push("buen calce"); if(cierraPronto(j))r.push("cierra pronto");
  if(r.length===1&&/calce/.test(r[0]))return "Entre las de mejor calce.";
  const t=r.join(" y ")||"Entre las de mejor calce"; return t[0].toUpperCase()+t.slice(1)+".";
}
function cuerpoDestacadas(){

}

const filtradasPost=()=>sinRespuesta().filter(p=>contiene(filtros.qP,p.cargo,p.empresa)&&(!filtros.canal||p.canal===filtros.canal));
function cuerpoPendientes(){
  if(!pendientes().length)return `<p class="vacio">No quedan ofertas por postular. Las nuevas aparecerán después de la próxima revisión.</p>`;
  const todas=filtradasPend();
  if(!todas.length)return vacioConLimpiar("No hay ofertas con estos filtros.");
  const arriba=hayFiltros()?[]:destacadas().map(e=>e.j);
  const orden={calce:(a,b)=>puntaje(b)-puntaje(a)||(b.first_seen||"").localeCompare(a.first_seen||""),recientes:(a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""),
    plazo:(a,b)=>(plazoDe(a)||9e15)-(plazoDe(b)||9e15)}[filtros.orden];
  const L=todas.filter(j=>!arriba.includes(j)).sort(orden);
  const listas=L.filter(j=>j.cv_listo), resto=L.filter(j=>!j.cv_listo);
  const fila=j=>tarjetaOferta(j);
  return grupo("Listas para enviar",listas.map(fila),"Con CV preparado. Solo falta enviarlas.")
    +grupo("Vale la pena mirar",resto.filter(j=>puntaje(j)>=60).map(fila),"Calce de 60 o más.")
    +plegado("Otras abiertas",resto.filter(j=>puntaje(j)>=50&&puntaje(j)<60).map(fila),"medias")

  <dt>Ya cerró</dt><dd>La saca de la lista y la guarda en el Registro anterior.</dd>
  <dd class="nota">Tus marcas se guardan solo en este navegador y se pueden deshacer.</dd></dl></details>`;
function conteoHTML(){return `<div class="conteo"><p class="estado" id="estado" role="status" tabindex="-1"></p><button type="button" class="leve" id="limpiar" data-limpiar="1" hidden>Limpiar filtros</button></div>`;}
function vistaPendientes(){
  const nuevas=pendientes().filter(esNueva).length;
  return `<h2 tabindex="-1">Por postular</h2>
  <p class="intro">Abre la oferta, postula en su sitio y vuelve a marcarla con <b>Ya postulé</b>.</p>
  ${LEYENDA}
  <div id="destacadas">${cuerpoDestacadas()}</div>
  <form class="herramientas" onsubmit="return false">
    <label class="campo buscar">Buscar<input type="search" id="q" value="${esc(filtros.q)}" placeholder="Cargo o empresa"></label>
    <label class="campo">Área<select id="area"><option value="">Todas</option>${Object.entries(AREA).map(([k,v])=>`<option value="${k}" ${filtros.area===k?"selected":""}>${v}</option>`).join("")}</select></label>
    <label class="campo">Ordenar por<select id="orden"><option value="calce" ${filtros.orden==="calce"?"selected":""}>Mejor calce</option><option value="recientes" ${filtros.orden==="recientes"?"selected":""}>Más recientes</option><option value="plazo" ${filtros.orden==="plazo"?"selected":""}>Cierre más próximo</option></select></label>
    <label class="casilla"><input type="checkbox" id="nuevas" ${filtros.nuevas?"checked":""}><span>Solo nuevas (<span id="numNuevas">${nuevas}</span>)</span></label>
  </form>
  ${conteoHTML()}
  <div id="resultados">${cuerpoPendientes()}</div>`;
}
function cuerpoPostuladas(){
  const L=filtradasPost();
  const rec=L.filter(p=>{const n=diasDesde(p.fecha);return n!==null&&n<=60}), ant=L.filter(p=>!rec.includes(p));
  const loc=marcasVivas(marcadas).filter(([j])=>contiene(filtros.qP,j.title,j.company)).map(([j,f])=>tarjetaLocal(j,f,"data-deshacer-post"));
  if(!L.length&&!loc.length)return hayFiltros()?vacioConLimpiar("No hay postulaciones con estos filtros."):`<p class="vacio">Aún no hay postulaciones sin respuesta. Cuando marques <b>Ya postulé</b>, aparecerán aquí.</p>`;
  return grupo("Marcadas por ti",loc,"Solo se ven en este navegador hasta anotarlas en el registro.")
    +grupo("Últimos 60 días",rec.map(p=>tarjetaPostulacion(p)))+plegado("Más antiguas",ant.map(p=>tarjetaPostulacion(p)),"antiguas");
}
function vistaPostuladas(){
  const canales=[...new Set(sinRespuesta().map(p=>p.canal))].sort();
  return `<h2 tabindex="-1">Postuladas</h2>
  <p class="intro">Enviadas y todavía sin respuesta. El signo ≈ indica una fecha aproximada.</p>
  <form class="herramientas" onsubmit="return false">
    <label class="campo buscar">Buscar<input type="search" id="qP" value="${esc(filtros.qP)}" placeholder="Cargo o empresa"></label>
    <label class="campo">Canal<select id="canal"><option value="">Todos</option>${canales.map(c=>`<option ${filtros.canal===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
  </form>
  ${conteoHTML()}
  <div id="resultados">${cuerpoPostuladas()}</div>`;
}
function vistaProceso(){
  const L=enProceso();
  return `<h2 tabindex="-1">En proceso</h2>
  <p class="intro">Con entrevista, prueba u otro avance real.</p>
  <p class="estado" id="estado" role="status" tabindex="-1"></p>
  <h3 class="oculto">Procesos activos</h3>
  ${L.length?`<ul class="lista">${L.map(p=>tarjetaPostulacion(p,true)).join("")}</ul>`:`<p class="vacio">No hay procesos activos. Cuando te llamen a una entrevista o prueba, aparecerán aquí.</p>`}`;
}
function cuerpoRegistro(){
  const L=caducadas().filter(j=>contiene(filtros.qR,j.title,j.company));
  const vis=L.slice(0,filtros.verR).map(j=>`<li class="tarjeta compacta">${logoHTML(j.company)}<div class="cuerpo">
    <h4 class="cargo">${esc(j.title)}</h4><p class="empresa">${esc(j.company)}</p>
    <p class="datos"><span>${esc(j.etapa==="caducada"?j.motivo:"Venció su plazo")}</span></p></div><div class="lado"><p class="fecha"><b>${esc(fechaTxt(j.date_posted&&aFecha(j.date_posted)?j.date_posted:j.first_seen))}</b></p></div></li>`);
  return `<section class="grupo"><h3>Ofertas caducadas<span class="n">${L.length}</span></h3>${vis.length?`<ul class="lista">${vis.join("")}</ul>`:`<p class="vacio">Ninguna oferta caducada coincide con esa búsqueda.</p>`}
  ${L.length>filtros.verR?`<p class="mas"><button type="button" id="verMas">Mostrar 50 más</button></p>`:""}</section>`;
}
function vistaRegistro(){
  const loc=marcasVivas(cerradas).map(([j,f])=>tarjetaLocal(j,f,"data-deshacer-cerro"));
  const res=conResultado().map(p=>tarjetaPostulacion(p));
  return `<h2 tabindex="-1">Registro anterior</h2>
  <p class="intro">Lo que ya salió de las listas principales. Nada se borra.</p>
  <p class="estado" id="estado" role="status" tabindex="-1"></p>
  ${grupo("Resultados de postulaciones",res,"Procesos que ya tuvieron respuesta.")}
  ${grupo("Marcadas por ti como cerradas",loc,"Solo se ven en este navegador.")}
  <form class="herramientas" onsubmit="return false" style="margin-top:22px"><label class="campo buscar">Buscar en caducadas<input type="search" id="qR" value="${esc(filtros.qR)}" placeholder="Cargo o empresa"></label></form>
  <div id="resultados">${cuerpoRegistro()}</div>`;
}
function pintarConteo(){
  const v=vistaActual(), e=document.getElementById("estado"), b=document.getElementById("limpiar"); if(!e)return;
  if(v==="pendientes"){const t=pendientes().length;e.textContent=hayFiltros()?`${filtradasPend().length} de ${plural(t,"oferta","ofertas")}`:plural(t,"oferta abierta","ofertas abiertas");}
  else if(v==="postuladas"){const loc=marcasVivas(marcadas), t=sinRespuesta().length+loc.length, n=filtradasPost().length+loc.filter(([j])=>contiene(filtros.qP,j.title,j.company)).length;e.textContent=hayFiltros()?`${n} de ${plural(t,"postulación","postulaciones")}`:plural(t,"postulación","postulaciones")+" sin respuesta";}
  if(b)b.hidden=!hayFiltros();
}
function render(foco){
  const v=vistaActual();
  pintarNav();
  const m=document.getElementById("contenido");
  m.innerHTML={pendientes:vistaPendientes,postuladas:vistaPostuladas,proceso:vistaProceso,registro:vistaRegistro}[v]();
  pintarConteo();
  document.title=`${v==="registro"?"Registro anterior":VISTAS[v][0]} · Visor de trabajos`;
  if(foco){m.querySelector("h2").focus({preventScroll:true});window.scrollTo(0,0);}
}
function refrescarResultados(){
  const v=vistaActual(), r=document.getElementById("resultados"), d=document.getElementById("destacadas");
  if(v==="proceso")return;
  if(d)d.innerHTML=cuerpoDestacadas();
  if(r)r.innerHTML={pendientes:cuerpoPendientes,postuladas:cuerpoPostuladas,registro:cuerpoRegistro}[v]();
  const nn=document.getElementById("numNuevas"); if(nn)nn.textContent=pendientes().filter(esNueva).length;
  pintarConteo();
}
const actualizar=()=>{pintarNav();vistaActual()==="registro"?render():refrescarResultados();};

/* Aviso con Deshacer: queda visible aunque la lista esté lejos */
let relojAviso=null;
function ocultarAviso(){
  const a=document.getElementById("aviso");
  if(a.contains(document.activeElement)){relojAviso=setTimeout(ocultarAviso,3000);return;}
  a.classList.remove("ver");a.innerHTML="";
}
function avisar(texto,boton=""){
  const a=document.getElementById("aviso");
  clearTimeout(relojAviso);a.classList.add("ver");
  a.innerHTML=`<span>${texto}</span>${boton}`;
  relojAviso=setTimeout(ocultarAviso,boton?10000:4000);
}
function enfocar(id){
  const destino=[...document.querySelectorAll("[data-card]")].find(c=>c.dataset.card===id);
  (destino?.querySelector("a,button")||document.getElementById("estado"))?.focus({preventScroll:true});
}

/* Eventos */
document.getElementById("saltar").addEventListener("click",e=>{e.preventDefault();document.getElementById("contenido").focus();});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q")filtros.q=e.target.value; else if(id==="qP")filtros.qP=e.target.value;
  else if(id==="qR"){filtros.qR=e.target.value;filtros.verR=50;} else return;
  refrescarResultados();
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="area")filtros.area=e.target.value; else if(id==="orden")filtros.orden=e.target.value;
  else if(id==="nuevas")filtros.nuevas=e.target.checked; else if(id==="canal")filtros.canal=e.target.value; else return;
  refrescarResultados();
});
const hoyISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const vecinoDe=b=>{const li=b.closest("[data-card]");return (li?.nextElementSibling||li?.previousElementSibling)?.dataset.card;};
document.addEventListener("click",e=>{
  const s=e.target.closest("summary[data-g]");
  if(s){const det=s.parentElement,k=s.dataset.g;setTimeout(()=>det.open?abiertos.add(k):abiertos.delete(k),0);return;}
  const b=e.target.closest("button"); if(!b)return;
  const d=b.dataset;
  if(b.id==="verMas"){filtros.verR+=50;refrescarResultados();return;}
  if(d.limpiar){Object.assign(filtros,{q:"",area:"",nuevas:false,qP:"",canal:""});render();document.getElementById("estado")?.focus({preventScroll:true});return;}
  if(d.postule){const v=vecinoDe(b);marcadas[d.postule]=hoyISO();store.set("visor_marcadas",marcadas);actualizar();enfocar(v);
    avisar("Pasó a Postuladas.",`<button type="button" data-deshacer-post="${esc(d.postule)}">Deshacer</button>`);}
  else if(d.cerro){const v=vecinoDe(b);cerradas[d.cerro]=hoyISO();store.set("visor_cerradas",cerradas);actualizar();enfocar(v);
    avisar("Pasó al Registro anterior.",`<button type="button" data-deshacer-cerro="${esc(d.cerro)}">Deshacer</button>`);}
  else if(d.deshacerPost){delete marcadas[d.deshacerPost];store.set("visor_marcadas",marcadas);actualizar();document.getElementById("estado")?.focus({preventScroll:true});avisar("Listo, volvió a Por postular.");}
  else if(d.deshacerCerro){delete cerradas[d.deshacerCerro];store.set("visor_cerradas",cerradas);actualizar();document.getElementById("estado")?.focus({preventScroll:true});avisar("Listo, volvió a Por postular.");}
});
window.addEventListener("hashchange",()=>render(true));

/* Carga */
document.getElementById("marca").insertAdjacentHTML("afterbegin",icono("castillo"));
fetch("../data/jobs.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  DATOS=d; jobs=d.jobs; postulaciones=d.postulaciones||[];
  ultimaFecha=jobs.reduce((m,j)=>(j.first_seen||"")>m?j.first_seen:m,"");
  const u=new Date(d.updated);
  document.getElementById("actualizado").textContent=`Última revisión: ${u.getDate()} ${MESES[u.getMonth()]}, ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")}`;
  render();
}).catch(()=>{
  document.getElementById("actualizado").textContent="";
  document.getElementById("contenido").innerHTML=`<h2>No se pudieron cargar las ofertas</h2><p class="intro">Revisa tu conexión y vuelve a intentarlo.</p><button type="button" onclick="location.reload()">Recargar</button>`;
});
</script>
</body>
</html>
