<style>
:root{
  --fondo:#F4EEDF;--superficie:#FBF7EC;--tinta:#2B2420;--suave:#5F574C;--linea:#D9CFB8;
  --vino:#7A2E2E;--oro:#B8862D;--oro-fondo:#F0E3BF;--bosque:#2F5A3B;--piedra:#8A8172;
  --pixel:"Pixelify Sans","Fira Sans",sans-serif;--texto:"Fira Sans",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#1C1814;--superficie:#26211B;--tinta:#EFE7D6;--suave:#B8AE9C;--linea:#3D362C;
  --vino:#E09A8E;--oro:#D4A94A;--oro-fondo:#3A3020;--bosque:#8CC49B;--piedra:#9A9080;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.5 var(--texto);overflow-wrap:anywhere}
a{color:inherit}
.pix{display:block;width:24px;height:24px;flex:none}
.saltar{position:absolute;left:-999px;top:0;background:var(--superficie);padding:12px 16px;z-index:5}
.saltar:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
.marco{max-width:880px;margin:0 auto;padding:0 16px}

/* Cabecera */
.cabecera{padding:20px 16px 12px}
.marca{display:flex;align-items:center;gap:12px}
.marca .pix{width:32px;height:32px}
h1{font:600 28px/1.1 var(--pixel);margin:0}
.actualizado{margin:2px 0 0;font-size:14px;color:var(--suave)}
.almenas{height:8px;background:
  repeating-linear-gradient(90deg,var(--tinta) 0 12px,transparent 12px 20px) top/100% 4px no-repeat,
  linear-gradient(var(--tinta),var(--tinta)) bottom/100% 4px no-repeat}

/* Navegación */
.nav{position:sticky;top:0;z-index:3;background:var(--fondo);border-bottom:1px solid var(--linea)}
.nav ul{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;margin:0;padding:0}
.nav a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 4px;
  font:500 17px/1.15 var(--pixel);text-decoration:none;color:var(--suave);border-bottom:4px solid transparent;text-align:center}
.nav a:hover{color:var(--tinta);background:var(--superficie)}
.nav a[aria-current=page]{color:var(--tinta);border-bottom-color:var(--vino);font-weight:600}
.nav .n{font:500 14px/1 var(--texto);font-variant-numeric:tabular-nums}
.nav .rotulo{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;justify-content:center}

/* Vistas */
main.marco{padding:24px 16px 32px}
main:focus{outline:none}
h2{font:600 22px/1.2 var(--pixel);margin:0}
h2:focus{outline:none}
.intro{margin:4px 0 16px;color:var(--suave)}
.herramientas{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 8px}
.campo{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--suave);flex:0 1 auto}
.campo.buscar{flex:1 1 220px}
input[type=search],select{font:400 16px var(--texto);color:var(--tinta);background:var(--superficie);
  border:1px solid var(--piedra);border-radius:2px;min-height:44px;padding:8px 10px;width:100%}
.casilla{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--tinta);font-size:16px;cursor:pointer}
.casilla input{width:20px;height:20px;accent-color:var(--vino);margin:0}
.estado{min-height:24px;margin:0 0 8px;font-size:14px;color:var(--suave)}
.estado:focus{outline:none}
.estado button{margin-left:8px}

/* Grupos y filas */
.grupo{margin-top:20px}
.grupo>h3,summary.titulo{font:500 18px/1.3 var(--pixel);margin:0;padding:8px 0;border-bottom:2px solid var(--tinta);color:var(--tinta)}
summary.titulo{cursor:pointer;min-height:44px;display:list-item}
summary.titulo:hover{color:var(--vino)}
.grupo .n{font:400 14px var(--texto);color:var(--suave);margin-left:4px}
.lista{list-style:none;margin:0;padding:0}
.fila{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--linea)}
.logo{position:relative;display:block;width:40px;height:40px;background:var(--oro-fondo);color:var(--tinta);
  font:600 15px/40px var(--pixel);text-align:center;
  clip-path:polygon(0 0,100% 0,100% 72%,90% 72%,90% 82%,80% 82%,80% 90%,60% 90%,60% 100%,40% 100%,40% 90%,20% 90%,20% 82%,10% 82%,10% 72%,0 72%)}
.logo.con-imagen{background:#fff;clip-path:none;border:1px solid var(--linea);border-radius:2px;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;background:#fff;image-rendering:auto}
.logo img.chico{image-rendering:pixelated;padding:8px}
.cuerpo{min-width:0}
.cargo{font:500 16px/1.35 var(--texto);margin:0}
.cargo a{text-decoration:none}
.cargo a:hover{text-decoration:underline;color:var(--vino)}
.empresa{margin:0;color:var(--suave)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin:2px 0 0;font-size:14px;color:var(--suave);font-variant-numeric:tabular-nums}
.detalle{margin:4px 0 0;font-size:14px;color:var(--suave)}
.marca-t{font-weight:600;color:var(--bosque)}
.alerta{font-weight:600;color:var(--vino)}
.acciones{display:flex;gap:8px;align-items:flex-start}
.fecha{font-size:14px;color:var(--suave);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fecha b{display:block;font-weight:500;color:var(--tinta)}
button{font:500 14px var(--texto);color:var(--tinta);background:transparent;border:1px solid var(--piedra);
  border-radius:2px;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--superficie);border-color:var(--tinta)}
.vacio{padding:24px 0;color:var(--suave)}
.mas{margin:16px 0 0}

/* Pie */
.pie{padding:16px 16px 32px;font-size:14px;color:var(--suave)}
.pie a{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--tinta);font-weight:500}
.pie .pix{width:20px;height:20px}

@media (max-width:620px){
  h1{font-size:24px}
  .nav a{flex-direction:column;gap:2px;font-size:15px;min-height:64px}
  .nav .rotulo{flex-direction:column;align-items:center}
  .fila{grid-template-columns:40px minmax(0,1fr)}
  .acciones{grid-column:2}
  .fecha{grid-column:2;text-align:left}
  .fecha b{display:inline;margin-right:8px}
  .campo.buscar{flex-basis:100%}
  .campo{flex:1 1 40%}
}
@media (prefers-reduced-motion:no-preference){a,button{transition:color .12s,background-color .12s,border-color .12s}}
</style>

const quitarAcentos = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9&]+/g," ").trim();

/* Utilidades */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const aFecha = t => { const m=/^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(t||""); return m?new Date(+m[1],+m[2]-1,+(m[3]||1)):null; };
const esAprox = t => /^\d{4}-\d{2}$/.test(t||"");
const fechaTxt = t => { const d=aFecha(t); if(!d)return "Fecha no registrada"; return esAprox(t)?`≈ ${MESES[d.getMonth()]} ${d.getFullYear()}`:`${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const HOY=new Date(); HOY.setHours(0,0,0,0);
const diasDesde = t => { const d=aFecha(t); return d?Math.round((HOY-d)/864e5):null; };
const haceTxt = t => { if(esAprox(t))return ""; const n=diasDesde(t); if(n===null||n<0)return ""; return n===0?"hoy":n===1?"hace 1 día":`hace ${n} días`; };

function logoHTML(empresa){
  const dom=dominioDe(empresa);
  const ini=esc(inicialesDe(empresa).slice(0,2));
  if(!dom) return `<span class="logo" aria-hidden="true">${ini}</span>`;
  return `<span class="logo con-imagen" aria-hidden="true">${ini}<img alt="" width="40" height="40" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-dom="${esc(dom)}" src="https://www.google.com/s2/favicons?domain=${esc(dom)}&sz=64"></span>`;
}
/* Fuentes de logo: Google, el favicon del propio sitio y DuckDuckGo. Sin logo real queda el escudo con iniciales. */
const FUENTES=[d=>`https://${d}/favicon.ico`,d=>`https://icons.duckduckgo.com/ip3/${d}.ico`];
function siguienteLogo(img){
  const n=+(img.dataset.paso||0);
  if(n>=FUENTES.length){const s=img.parentElement;img.remove();if(s)s.classList.remove("con-imagen");return;}
  img.dataset.paso=n+1;img.src=FUENTES[n](img.dataset.dom);
}
document.addEventListener("load",e=>{
  const img=e.target; if(img.tagName!=="IMG"||!img.dataset.dom)return;
  const paso=+(img.dataset.paso||0);
  /* Google entrega un globo de 16 px si no conoce el dominio; DuckDuckGo, una flecha gris de 48 px. */
  if((paso===0&&img.naturalWidth<=16)||(paso===2&&img.naturalWidth===48)){siguienteLogo(img);return;}
  img.classList.toggle("chico",img.naturalWidth<32);
},true);
document.addEventListener("error",e=>{
  const img=e.target; if(img.tagName==="IMG"&&img.dataset.dom)siguienteLogo(img);
},true);

/* Estado */
let DATOS=null, jobs=[], postulaciones=[];
let marcadas=store.get("visor_marcadas",{}), cerradas=store.get("visor_cerradas",{});
const filtros={q:"",area:"",orden:"calce",nuevas:false,qP:"",canal:"",qR:"",verR:50};
let ultimaFecha="";

const pendientes=()=>jobs.filter(j=>j.etapa==="pendiente"&&!marcadas[j.id]&&!cerradas[j.id]);
const sinRespuesta=()=>postulaciones.filter(p=>p.etapa==="sin_respuesta");
const enProceso=()=>postulaciones.filter(p=>p.etapa==="proceso");
const conResultado=()=>postulaciones.filter(p=>p.etapa==="cerrada");
const caducadas=()=>jobs.filter(j=>j.etapa==="caducada");
const porId=id=>jobs.find(j=>j.id===id);
const contiene=(q,...c)=>!q||quitarAcentos(c.join(" ")).includes(quitarAcentos(q));

/* Navegación */
const VISTAS={pendientes:["Por postular","pergamino"],postuladas:["Postuladas","carta"],proceso:["En proceso","espadas"]};
const vistaActual=()=>{const h=location.hash.slice(1);return (VISTAS[h]||h==="registro")?h:"pendientes";};
function pintarNav(){
  const v=vistaActual();
  const n={pendientes:pendientes().length,postuladas:sinRespuesta().length+Object.keys(marcadas).length,proceso:enProceso().length};
  document.getElementById("nav").innerHTML=Object.entries(VISTAS).map(([k,[t,ic]])=>
    `<li><a href="#${k}" ${v===k?'aria-current="page"':""}>${icono(ic)}<span class="rotulo">${t} <span class="n">${n[k]}</span></span></a></li>`).join("");
  document.getElementById("pie").innerHTML=`<a href="#registro" ${v==="registro"?'aria-current="page"':""}>${icono("libro")}Registro anterior (${caducadas().length+conResultado().length+Object.keys(cerradas).length})</a>`;
}

/* Filas */
function filaOferta(j){
  const url=urlSegura(j.url), plazo=plazoDe(j), d=[];
  d.push(`<span>${esc(calceTxt(j))}</span>`);
  if(plazo){const dias=Math.round((plazo-HOY)/864e5);d.push(`<span class="${dias<=7?"alerta":""}">Cierra ${plazo.getDate()} ${MESES[plazo.getMonth()]}${dias<=7?` (${dias===0?"hoy":dias===1?"mañana":`en ${dias} días`})`:""}</span>`);}
  if(MODAL[j.modality])d.push(`<span>${MODAL[j.modality]}</span>`);
  if(j.salary)d.push(`<span>${esc(j.salary)}</span>`);
  d.push(`<span>${esc(j.source)}</span>`);
  if(j.first_seen===ultimaFecha)d.unshift(`<span class="marca-t">Nueva</span>`);
  if(j.ya_postulada)d.unshift(`<span class="alerta">Ya postulaste: ${esc(fechaTxt(j.ya_postulada))}</span>`);
  return `<li class="fila">${logoHTML(j.company)}<div class="cuerpo">
    <h4 class="cargo">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(j.title)}</a>`:esc(j.title)}</h4>
    <p class="empresa">${esc(j.company)}</p><p class="meta">${d.join("")}</p></div>
    <div class="acciones"><button type="button" data-postule="${esc(j.id)}">Ya postulé</button><button type="button" data-cerro="${esc(j.id)}">Ya cerró</button></div></li>`;
}
function filaPostulacion(p){
  const url=urlSegura(p.url), hace=haceTxt(p.fecha);
  return `<li class="fila">${logoHTML(p.empresa)}<div class="cuerpo">
    <h4 class="cargo">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(p.cargo)}</a>`:esc(p.cargo)}</h4>
    <p class="empresa">${esc(p.empresa)}</p><p class="meta"><span>${esc(p.canal)}</span></p>
    ${p.detalle?`<p class="detalle">${esc(p.detalle)}</p>`:""}</div>
    <div class="fecha"><b>${esc(fechaTxt(p.fecha))}</b>${esc(hace)}</div></li>`;
}
function filaLocal(j,fecha,attr,boton){
  const url=urlSegura(j.url);
  return `<li class="fila">${logoHTML(j.company)}<div class="cuerpo">
    <h4 class="cargo">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(j.title)}</a>`:esc(j.title)}</h4>
    <p class="empresa">${esc(j.company)}</p><p class="meta"><span>Marcada el ${esc(fechaTxt(fecha))}</span></p></div>
    <div class="acciones"><button type="button" ${attr}="${esc(j.id)}">${boton}</button></div></li>`;
}
const grupo=(titulo,filas,extra="")=>filas.length?`<section class="grupo"><h3>${titulo}<span class="n">${filas.length}</span></h3>${extra}<ul class="lista">${filas.join("")}</ul></section>`:"";
const plegado=(titulo,filas)=>filas.length?`<details class="grupo"><summary class="titulo">${titulo}<span class="n">${filas.length}</span></summary><ul class="lista">${filas.join("")}</ul></details>`:"";

/* Vistas */
function cuerpoPendientes(){
  let L=pendientes().filter(j=>contiene(filtros.q,j.title,j.company,j.location)&&(!filtros.area||j.category===filtros.area)&&(!filtros.nuevas||j.first_seen===ultimaFecha));
  const orden={calce:(a,b)=>puntaje(b)-puntaje(a),recientes:(a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""),
    plazo:(a,b)=>(plazoDe(a)||9e15)-(plazoDe(b)||9e15)}[filtros.orden];
  L=[...L].sort(orden);
  const listas=L.filter(j=>j.cv_listo), resto=L.filter(j=>!j.cv_listo);
  const buenas=resto.filter(j=>puntaje(j)>=50), bajas=resto.filter(j=>puntaje(j)<50);
  if(!L.length)return `<p class="vacio">No hay ofertas con estos filtros.</p>`;
  return grupo("Listas para enviar",listas.map(filaOferta),`<p class="detalle">Con CV preparado. Solo falta enviarlas.</p>`)
    +grupo("Abiertas",buenas.map(filaOferta))+plegado("Calce bajo",bajas.map(filaOferta));
}
function vistaPendientes(){
  const nuevas=pendientes().filter(j=>j.first_seen===ultimaFecha).length;
  return `<h2 tabindex="-1">Por postular</h2>
  <p class="intro">Ofertas abiertas a las que aún no postulas. ${nuevas?`${nuevas} ${nuevas===1?"apareció":"aparecieron"} en la última revisión.`:""}</p>
  <form class="herramientas" onsubmit="return false">
    <label class="campo buscar">Buscar<input type="search" id="q" value="${esc(filtros.q)}" placeholder="Cargo o empresa"></label>
    <label class="campo">Área<select id="area"><option value="">Todas</option>${Object.entries(AREA).map(([k,v])=>`<option value="${k}" ${filtros.area===k?"selected":""}>${v}</option>`).join("")}</select></label>
    <label class="campo">Ordenar por<select id="orden"><option value="calce" ${filtros.orden==="calce"?"selected":""}>Mejor calce</option><option value="recientes" ${filtros.orden==="recientes"?"selected":""}>Más recientes</option><option value="plazo" ${filtros.orden==="plazo"?"selected":""}>Cierre más próximo</option></select></label>
    <label class="casilla"><input type="checkbox" id="nuevas" ${filtros.nuevas?"checked":""}>Solo nuevas</label>
  </form>
  <p class="estado" id="estado" role="status" tabindex="-1"></p>
  <div id="resultados">${cuerpoPendientes()}</div>`;
}
function cuerpoPostuladas(){
  const L=sinRespuesta().filter(p=>contiene(filtros.qP,p.cargo,p.empresa)&&(!filtros.canal||p.canal===filtros.canal));
  const rec=L.filter(p=>{const n=diasDesde(p.fecha);return n!==null&&n<=60}), ant=L.filter(p=>!rec.includes(p));
  const loc=Object.entries(marcadas).map(([id,f])=>{const j=porId(id);return j&&contiene(filtros.qP,j.title,j.company)?filaLocal(j,f,"data-deshacer-post","Deshacer"):""}).filter(Boolean);
  if(!L.length&&!loc.length)return `<p class="vacio">No hay postulaciones con estos filtros.</p>`;
  return grupo("Marcadas en este navegador",loc,`<p class="detalle">Solo se ven aquí hasta anotarlas en el registro.</p>`)
    +grupo("Últimos 60 días",rec.map(filaPostulacion))+plegado("Más antiguas",ant.map(filaPostulacion));
}
function vistaPostuladas(){
  const canales=[...new Set(sinRespuesta().map(p=>p.canal))].sort();
  return `<h2 tabindex="-1">Postuladas sin respuesta</h2>
  <p class="intro">Enviadas y sin respuesta registrada. ≈ indica una fecha aproximada.</p>
  <form class="herramientas" onsubmit="return false">
    <label class="campo buscar">Buscar<input type="search" id="qP" value="${esc(filtros.qP)}" placeholder="Cargo o empresa"></label>
    <label class="campo">Canal<select id="canal"><option value="">Todos</option>${canales.map(c=>`<option ${filtros.canal===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
  </form>
  <p class="estado" id="estado" role="status" tabindex="-1"></p>
  <div id="resultados">${cuerpoPostuladas()}</div>`;
}
function vistaProceso(){
  const L=enProceso();
  return `<h2 tabindex="-1">En proceso</h2>
  <p class="intro">Procesos con entrevista, prueba u otro avance real.</p>
  ${L.length?`<ul class="lista">${L.map(filaPostulacion).join("")}</ul>`:`<p class="vacio">No hay procesos activos.</p>`}`;
}
function cuerpoRegistro(){
  const L=caducadas().filter(j=>contiene(filtros.qR,j.title,j.company));
  const vis=L.slice(0,filtros.verR).map(j=>`<li class="fila">${logoHTML(j.company)}<div class="cuerpo">
    <h4 class="cargo">${esc(j.title)}</h4><p class="empresa">${esc(j.company)}</p>
    <p class="meta"><span>${esc(j.motivo)}</span></p></div><div class="fecha"><b>${esc(fechaTxt(j.date_posted&&aFecha(j.date_posted)?j.date_posted:j.first_seen))}</b></div></li>`);
  return `<section class="grupo"><h3>Ofertas caducadas<span class="n">${L.length}</span></h3>${vis.length?`<ul class="lista">${vis.join("")}</ul>`:`<p class="vacio">Sin resultados.</p>`}
  ${L.length>filtros.verR?`<p class="mas"><button type="button" id="verMas">Mostrar 50 más</button></p>`:""}</section>`;
}
function vistaRegistro(){
  const loc=Object.entries(cerradas).map(([id,f])=>{const j=porId(id);return j?filaLocal(j,f,"data-deshacer-cerro","Deshacer"):""}).filter(Boolean);
  return `<h2 tabindex="-1">Registro anterior</h2>
  <p class="intro">Lo que ya no está en las listas principales. Nada se borra.</p>
  <p class="estado" id="estado" role="status" tabindex="-1"></p>
  ${grupo("Con resultado",conResultado().map(filaPostulacion))}
  ${grupo("Marcadas como cerradas en este navegador",loc)}
  <form class="herramientas" onsubmit="return false" style="margin-top:20px"><label class="campo buscar">Buscar en caducadas<input type="search" id="qR" value="${esc(filtros.qR)}" placeholder="Cargo o empresa"></label></form>
  <div id="resultados">${cuerpoRegistro()}</div>`;
}
function render(foco){
  const v=vistaActual();
  pintarNav();
  const m=document.getElementById("contenido");
  m.innerHTML={pendientes:vistaPendientes,postuladas:vistaPostuladas,proceso:vistaProceso,registro:vistaRegistro}[v]();
  document.title=`${v==="registro"?"Registro anterior":VISTAS[v][0]} · Visor de trabajos`;
  if(foco){m.querySelector("h2").focus({preventScroll:true});window.scrollTo(0,0);}
}
function refrescarResultados(){
  const v=vistaActual(), r=document.getElementById("resultados"); if(!r)return;
  r.innerHTML={pendientes:cuerpoPendientes,postuladas:cuerpoPostuladas,registro:cuerpoRegistro}[v]();
}
function avisar(html){const e=document.getElementById("estado");if(!e)return;e.innerHTML=html;e.focus({preventScroll:true});}

/* Eventos */
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q")filtros.q=e.target.value; else if(id==="qP")filtros.qP=e.target.value;
  else if(id==="qR"){filtros.qR=e.target.value;filtros.verR=50;} else return;
  refrescarResultados();
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="area")filtros.area=e.target.value; else if(id==="orden")filtros.orden=e.target.value;
  else if(id==="nuevas")filtros.nuevas=e.target.checked; else if(id==="canal")filtros.canal=e.target.value; else return;
  refrescarResultados();
});
const hoyISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const d=b.dataset;
  if(b.id==="verMas"){filtros.verR+=50;refrescarResultados();return;}
  if(d.postule){marcadas[d.postule]=hoyISO();store.set("visor_marcadas",marcadas);pintarNav();refrescarResultados();
    avisar(`Pasó a Postuladas.<button type="button" data-deshacer-post="${esc(d.postule)}">Deshacer</button>`);}
  else if(d.cerro){cerradas[d.cerro]=hoyISO();store.set("visor_cerradas",cerradas);pintarNav();refrescarResultados();
    avisar(`Pasó al Registro anterior.<button type="button" data-deshacer-cerro="${esc(d.cerro)}">Deshacer</button>`);}
  else if(d.deshacerPost){delete marcadas[d.deshacerPost];store.set("visor_marcadas",marcadas);pintarNav();refrescarResultados();avisar("Listo, volvió a Por postular.");}
  else if(d.deshacerCerro){delete cerradas[d.deshacerCerro];store.set("visor_cerradas",cerradas);render();avisar("Listo, volvió a Por postular.");}
});
window.addEventListener("hashchange",()=>{if(location.hash!=="#contenido")render(true)});

/* Carga */
document.getElementById("marca").insertAdjacentHTML("afterbegin",icono("castillo"));
fetch("../data/jobs.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  DATOS=d; jobs=d.jobs; postulaciones=d.postulaciones||[];
  ultimaFecha=jobs.reduce((m,j)=>(j.first_seen||"")>m?j.first_seen:m,"");
  const u=new Date(d.updated);
  document.getElementById("actualizado").textContent=`Actualizado el ${u.getDate()} ${MESES[u.getMonth()]} ${u.getFullYear()}, ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")}`;
  render();
}).catch(()=>{
  document.getElementById("actualizado").textContent="";
  document.getElementById("contenido").innerHTML=`<h2>No se pudieron cargar los datos</h2><p class="intro">Revisa la conexión y recarga la página.</p>`;
});
</script>
</body>
</html>
